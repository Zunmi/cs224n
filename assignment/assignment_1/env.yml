name: cs224n
channels:
  - conda-forge
  - defaults
  - huggingface
dependencies:
  - python=3.10       # Python 3.10 比较稳定，避免 3.12 的兼容性问题
  - jupyter
  - matplotlib=3.7.*  # 与 python3.10 和 numpy1.23 兼容
  - numpy=1.23.*      # 对 gensim / scipy 兼容性最好
  - ipykernel
  - scikit-learn=1.2.*
  - gensim=4.3.2      # 当前课程可用版本
  - scipy=1.10.1      # 必须锁定，避免 ImportError
  - datasets=2.18.0   # 你要求的版本

